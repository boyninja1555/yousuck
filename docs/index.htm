<body bgcolor="#DFDFDF" text="#080808">
    <center>
        <h1>
            <font size="6" face="arial">Download the next generation of mild insults...</font>
        </h1>

        <table cellpadding="5" border="5" bordercolor="green" bgcolor="lime">
            <tr>
                <td>
                    <a href="https://github.com/boyninja1555/yousuck/releases/latest/download/yousuck-x86_64-linux.tar.gz"
                        download>
                        <font color="#5F5F5F" size="5" face="sans-serif">Download</font>
                    </a>
                </td>
            </tr>
        </table>
    </center>

    <script type="text/javascript">
        const speed = 5.69;
        const minScale = .5, maxScale = 1;
        const minOffsetH = -250, maxOffsetH = 250;
        const minOffsetV = 0, maxOffsetV = 690;
        var scale = minScale;
        var scaleDirection = 1;
        var hOffsetDirection = 1;
        var vOffsetDirection = 1;
        var hOffset = minOffsetH;
        var vOffset = minOffsetV;
        var button = document.querySelector("table");
        function tick() {
            scale += scaleDirection * .05;
            if (scale <= minScale)
                scaleDirection = 1;
            else if (scale >= maxScale)
                scaleDirection = -1;

            hOffset += hOffsetDirection * speed;
            if (hOffset <= minOffsetH)
                hOffsetDirection = 1;
            else if (hOffset >= maxOffsetH)
                hOffsetDirection = -1;

            vOffset += vOffsetDirection * speed;
            if (vOffset <= minOffsetV)
                vOffsetDirection = 1;
            else if (vOffset >= maxOffsetV)
                vOffsetDirection = -1;

            button.style.scale = scale;
            button.style.translate = `${hOffset}% ${vOffset}%`;
            requestAnimationFrame(tick);
        }
        tick();
    </script>
</body>
