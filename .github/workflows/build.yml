name: Supply Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  supply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NASM
        run: sudo apt install -y nasm

      - name: Assemble
        run: make

      - name: TAR
        run: tar -czvf build/yousuck-x86_64-linux.tar.gz build/yousuck

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: build/yousuck-x86_64-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
